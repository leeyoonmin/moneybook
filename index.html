<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>머니북 — 가계부</title>
<meta name="description" content="매일 쓰기 좋은, 조용한 가계부. 수입과 지출을 기록하고 이번 달 흐름을 한눈에 확인하세요." />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F0EA" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111110" />
<meta name="color-scheme" content="light dark" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="머니북" />
<meta name="format-detection" content="telephone=no" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icons/favicon.png" sizes="64x64" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<link rel="stylesheet" href="./css/style.css" />
</head>
<body>

<div class="app" id="app">
  <div id="view" class="view" aria-live="polite"></div>

  <nav class="tabbar" aria-label="주요 메뉴">
    <button class="tab" data-act="tab" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.6 12 3.5l8 7.1V20a1 1 0 0 1-1 1h-4.4v-6.1H9.4V21H5a1 1 0 0 1-1-1z"/></svg>
      <span>홈</span>
    </button>
    <button class="tab" data-act="tab" data-tab="ledger">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>
      <span>기록</span>
    </button>
    <button class="tab" data-act="tab" data-tab="stats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>
      <span>통계</span>
    </button>
    <button class="tab" data-act="tab" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h8M17 7h3M4 17h3M11 17h9"/><circle cx="14.5" cy="7" r="2.2"/><circle cx="8.5" cy="17" r="2.2"/></svg>
      <span>설정</span>
    </button>
  </nav>

  <button class="fab" id="fab" data-act="add" aria-label="기록 추가">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</div>

<div id="sheetRoot"></div>
<div id="modalRoot"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" class="sr-only" tabindex="-1" aria-hidden="true" />

<script src="./js/vendor/supabase.js"></script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
